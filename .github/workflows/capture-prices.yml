name: Capture daily prices

on:
  schedule:
    # 00:30 UTC = 21:30 America/Sao_Paulo.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Capture all official asset prices
        run: python scripts/capture_prices.py

      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.csv capture-log.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: capture daily asset prices"
            git push
          fi

      - name: Build deployable site
        run: python scripts/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
