name: Deploy portal

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Capture daily prices"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deployable site
        run: python scripts/build_site.py

      - name: Install deterministic simulation fix
        run: |
          cp simulation-display-fix.js dist/simulation-display-fix.js
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          replacements = {
              'trades-ui.js?v=20260901': 'trades-ui.js?v=20260903-1',
              'runtime-fixes.js?v=20260903-1': 'runtime-fixes.js?v=20260903-2',
              'simulation-display-fix.js?v=20260901-2': 'simulation-display-fix.js?v=20260903-4',
              'simulation-display-fix.js?v=20260903-3': 'simulation-display-fix.js?v=20260903-4'
          }
          for old, new in replacements.items():
              html = html.replace(old, new)
          tag = '<script src="simulation-display-fix.js?v=20260903-4" defer></script>'
          if tag not in html:
              html = html.replace('</body>', f'{tag}\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Install deterministic Trades launcher
        run: |
          cp trades-launcher.js dist/trades-launcher.js
          cp trades-arbitrage-refresh.js dist/trades-arbitrage-refresh.js
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          tags = [
              '<script src="trades-launcher.js?v=20260901-3" defer></script>',
              '<script src="trades-arbitrage-refresh.js?v=20260901-1" defer></script>'
          ]
          for tag in tags:
              if tag not in html:
                  html = html.replace('</body>', f'{tag}\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Install Trades runtime guard
        run: |
          cp trades-runtime-guard.js dist/trades-runtime-guard.js
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          tag = '<script src="trades-runtime-guard.js?v=20260901-1" defer></script>'
          if tag not in html:
              html = html.replace('</body>', f'{tag}\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
