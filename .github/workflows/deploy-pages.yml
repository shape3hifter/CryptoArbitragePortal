name: Deploy portal

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Capture daily prices"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Unique per run AND retry attempt: a rerun cannot collide with an artifact
      # left behind by the previous attempt.
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deployable site
        run: python scripts/build_site.py

      - name: Install deterministic simulation fix
        run: |
          cp simulation-display-fix.js dist/simulation-display-fix.js
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          replacements = {
              'trades-ui.js?v=20260901': 'trades-ui.js?v=20261004-7',
              'runtime-fixes.js?v=20261004-7': 'runtime-fixes.js?v=20261004-7',
              'runtime-fixes.js?v=20260903-1': 'runtime-fixes.js?v=20261004-7',
              'runtime-fixes.js?v=20260903-2': 'runtime-fixes.js?v=20261004-7',
              'runtime-fixes.js?v=20260903-5': 'runtime-fixes.js?v=20261004-7',
              'simulation-display-fix.js?v=20260901-2': 'simulation-display-fix.js?v=20260903-7',
              'simulation-display-fix.js?v=20260903-3': 'simulation-display-fix.js?v=20260903-7',
              'simulation-display-fix.js?v=20260903-4': 'simulation-display-fix.js?v=20260903-7',
              'simulation-display-fix.js?v=20260903-5': 'simulation-display-fix.js?v=20260903-7',
              'simulation-display-fix.js?v=20260903-6': 'simulation-display-fix.js?v=20260903-7',
              'trades-launcher.js?v=20260901-3': 'trades-launcher.js?v=20260903-3',
              'trades-arbitrage-refresh.js?v=20260901-1': 'trades-arbitrage-refresh.js?v=20260903-3',
              'trades-runtime-guard.js?v=20260901-1': 'trades-runtime-guard.js?v=20260903-3'
          }
          for old, new in replacements.items():
              html = html.replace(old, new)
          tag = '<script src="simulation-display-fix.js?v=20260903-7" defer></script>'
          if tag not in html:
              html = html.replace('</body>', f'{tag}\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Install deterministic Trades launcher
        run: |
          cp trades-launcher.js dist/trades-launcher.js
          cp trades-arbitrage-refresh.js dist/trades-arbitrage-refresh.js
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          tags = [
              '<script src="trades-launcher.js?v=20260903-3" defer></script>',
              '<script src="trades-arbitrage-refresh.js?v=20260903-3" defer></script>'
          ]
          for tag in tags:
              if tag not in html:
                  html = html.replace('</body>', f'{tag}\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Install Trades runtime guard
        run: |
          cp trades-runtime-guard.js dist/trades-runtime-guard.js
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          tag = '<script src="trades-runtime-guard.js?v=20260903-3" defer></script>'
          if tag not in html:
              html = html.replace('</body>', f'{tag}\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist

      # The Pages artifact can take a moment to appear in the Actions API after
      # upload-pages-artifact reports success. Poll for this exact attempt's
      # artifact before deploy-pages queries it.
      - name: Verify Pages artifact is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq "[.artifacts[] | select(.name == \"${PAGES_ARTIFACT_NAME}\" and .expired == false)] | length")"
            if [ "$count" -eq 1 ]; then
              echo "Confirmed exactly one Pages artifact: ${PAGES_ARTIFACT_NAME}"
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "Unexpected duplicate Pages artifacts for this run attempt." >&2
              exit 1
            fi
            echo "Pages artifact not visible yet (check ${attempt}/12); waiting 5 seconds."
            sleep 5
          done
          echo "Pages artifact did not become visible within 60 seconds." >&2
          exit 1

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
