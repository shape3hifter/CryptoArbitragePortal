name: Deploy portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deployable site
        run: python scripts/build_site.py

      - name: Install deterministic portal runtime fixes
        run: |
          cp runtime-fixes.js dist/runtime-fixes.js
          cp simulation-display-fix.js dist/simulation-display-fix.js
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          tags = [
              '<script src="runtime-fixes.js?v=20260831-1" defer></script>',
              '<script src="simulation-display-fix.js?v=20260831-1" defer></script>'
          ]
          for tag in tags:
              if tag not in html:
                  html = html.replace('</body>', f'{tag}\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Install deterministic Trades launcher
        run: |
          cp trades-launcher.js dist/trades-launcher.js
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          tag = '<script src="trades-launcher.js?v=20260831-2" defer></script>'
          if tag not in html:
              html = html.replace('</body>', f'{tag}\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
